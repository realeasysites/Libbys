<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Login | Libby Septic Service</title>
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<style>
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;background:#0e120e;color:#1d231d;
  background-image:repeating-linear-gradient(-55deg,transparent 0 24px,rgba(255,255,255,.03) 24px 48px)}
  .box{width:min(400px,92vw);background:#fff;border-radius:14px;padding:32px;border-top:6px solid #2fae3c;box-shadow:0 30px 80px -20px rgba(0,0,0,.7)}
  h1{margin:0 0 4px;font:900 italic 2rem 'Barlow Condensed',Impact,sans-serif;text-transform:uppercase}
  p{margin:0 0 22px;color:#5d6a5c;font-size:.92rem}
  label{display:block;font-weight:600;font-size:.85rem;margin:0 0 5px}
  input{width:100%;padding:12px 14px;border:2px solid #dfe7dd;border-radius:8px;font:inherit;margin-bottom:16px}
  input:focus{outline:none;border-color:#2fae3c}
  button{width:100%;padding:13px;border:0;border-radius:8px;background:#2fae3c;color:#fff;font-weight:700;font-size:1rem;cursor:pointer}
  .err{background:#fdecea;color:#a3241a;padding:10px 12px;border-radius:8px;font-size:.88rem;margin-bottom:16px;display:none}
</style></head>
<body>
  <form class="box" method="post" action="/admin/login">
    <h1>Lead Dashboard</h1>
    <p>Libby Septic Service Excavation &amp; Trucking</p>
    <div class="err" id="err">Wrong username or password.</div>
    <label for="u">Username</label><input id="u" name="username" autocomplete="username" required>
    <label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <script>if(location.search.indexOf('error')>-1)document.getElementById('err').style.display='block';</script>
</body></html>
